<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Surprise for Laiba ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #fbcfe8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .card {
      background: #fce7f3;
      border: 3px solid #f472b6;
      border-radius: 24px;
      padding: 30px;
      width: 90%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.2);
      position: relative;
    }

    .step {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    .step.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, h2 {
      color: #9d174d;
      font-size: 1.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p {
      color: #be185d;
      font-size: 1.1rem;
    }

    .media-box {
      width: 180px;
      height: 180px;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f472b6;
    }

    .media-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      width: 100%;
      position: relative;
    }

    button {
      background-color: #ec4899;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 4px 10px rgba(236, 72, 153, 0.3);
    }

    button:hover {
      background-color: #db2777;
      transform: scale(1.05);
    }

    .letter-card {
      background: #fff;
      border: 2px dashed #f472b6;
      border-radius: 16px;
      padding: 20px;
      color: #831843;
      text-align: left;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .letter-card p {
      color: #831843;
      margin-bottom: 10px;
    }

    .heart-bg {
      font-size: 4rem;
      color: #ec4899;
      animation: pulse 1.2s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }
  </style>
</head>
